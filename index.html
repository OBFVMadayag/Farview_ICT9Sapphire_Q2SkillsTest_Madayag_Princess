<div class="container">

<div class="container">
    <div class="row">
        <div class="col bg-info">

        </div>
    </div>
</div>

<br>

<div class="container">
    <div class="row gap-2">

        <div class="col bg-light">
            <form action="" class="bg-warning">
                <label for="First name" class="text-primary" style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; text-align: left; font-size: 25px;">First Name</label>
                <br>
                <input type="text" id="FirstName" name="FirstName" class="bg-light text-dark" style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; width: 600px; max-width: 600px;" required>
            </form>
        </div>

        <div class="col bg-light">
            <form action="" class="bg-info">
                <label for="Last Name" class="text-primary" style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; text-align: left; font-size: 25px;">Last Name</label>
                <br>
                <input type="text" id="LastName" name="LastName" class="bg-light text-dark" style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; width: 600px; max-width: 600px;" required>
            </form>
        </div>

    </div>
</div>

<div class="container">

                <br>
                <input type="text" id="BirthDate" name="BirthDate" class="bg-light text-dark" style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; width: 600px; max-width: 600px;" required>
            </form>
        </div>

        <div class="col bg-light">
            <form action="" class="bg-warning">
                <label for="Gender" class="text-primary" style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; text-align: left; font-size: 25px;">Gender</label>
                <br>
                <select id="Gender" name="Gender" class="bg-light text-dark" style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; width: 600px; max-width: 600px;" required>
                    <option value="Male" class="text-dark" style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">Select...</option>
                    <option value="Male" class="text-dark" style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">Male</option>
                    <option value="Male" class="text-dark" style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">Female</option>
                </select>
            </form>
        </div>

        <div class="col bg-light">

                <select id="Grade Level" name="Grade level" class="bg-light text-dark" style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif; width: 600px; max-width: 600px;" required>
                    <option value="Male" class="text-dark" style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">Select...</option>

                    <option value="Male" class="text-dark" style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">Advanced Casa</option>
                    <option value="Male" class="text-dark" style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">Grade 1</option>
                    <option value="Male" class="text-dark" style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">Grade 2</option>

                    <option value="Male" class="text-dark" style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">Grade 8</option>
                    <option value="Male" class="text-dark" style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">Grade 9</option>
                    <option value="Male" class="text-dark" style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">Grade 10</option>
                    <option value="Male" class="text-dark" style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">Grade 11</option>
                    <option value="Male" class="text-dark" style="font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;">Grade 12</option>
                </select>

        <div class="col bg-light">
